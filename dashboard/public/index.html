<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPulse Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid #334155;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .header h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .badge {
      background: #22c55e;
      color: #000;
      padding: 0.2rem 0.6rem;
      border-radius: 1rem;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .dashboard {
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
    }
    .card h3 {
      color: #94a3b8;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    .card .value {
      font-size: 2rem;
      font-weight: 700;
      color: #f1f5f9;
    }
    .card .value.green { color: #22c55e; }
    .card .value.yellow { color: #eab308; }
    .card .value.red { color: #ef4444; }
    .status-text {
      margin-top: 1rem;
      padding: 1rem;
      background: #0f172a;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.875rem;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ EduPulse</h1>
    <span class="badge">LIVE</span>
  </div>

  <div class="dashboard">
    <div class="card">
      <h3>Queue Length</h3>
      <div class="value" id="queueLength">—</div>
    </div>
    <div class="card">
      <h3>Admission Rate</h3>
      <div class="value green" id="admissionRate">—</div>
    </div>
    <div class="card">
      <h3>Avg Latency</h3>
      <div class="value yellow" id="avgLatency">—</div>
    </div>
    <div class="card">
      <h3>Error Rate</h3>
      <div class="value" id="errorRate">—</div>
    </div>
    <div class="card">
      <h3>Active Targets</h3>
      <div class="value" id="activeTargets">—</div>
    </div>
    <div class="card">
      <h3>System Status</h3>
      <div class="value green" id="systemStatus">Initializing...</div>
    </div>
  </div>

  <div class="status-text">
    Dashboard sẽ được nâng cấp với Chart.js real-time graphs trong Giai đoạn 2 (Tuần 6)
  </div>

  <script>
    // Placeholder — will be connected to real APIs later
    const API_BASE = window.location.origin;

    async function fetchStats() {
      try {
        // Queue stats
        const queueRes = await fetch(`${API_BASE}/api/queue/stats`);
        if (queueRes.ok) {
          const data = await queueRes.json();
          document.getElementById('queueLength').textContent = data.totalInQueue || 0;
          document.getElementById('admissionRate').textContent = `${data.admissionRate || 0}/s`;
        }
      } catch (err) {
        console.log('Waiting for services...');
      }
    }

    // Poll every 3 seconds
    setInterval(fetchStats, 3000);
    fetchStats();
  </script>
</body>
</html>
