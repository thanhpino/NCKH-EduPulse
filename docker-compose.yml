# EduPulse — Docker Compose

services:
  # ---- Databases ----
  mongo-registry:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-registry-data:/data/db
    networks:
      - edupulse-net

  mongo-alert:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo-alert-data:/data/db
    networks:
      - edupulse-net

  mongo-mock:
    image: mongo:7
    ports:
      - "27019:27017"
    volumes:
      - mongo-mock-data:/data/db
    networks:
      - edupulse-net

  redis-gateway:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - edupulse-net

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: probe_pass
      POSTGRES_DB: edupulse_metrics
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    networks:
      - edupulse-net

  postgres-advisor:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: advisor_pass
      POSTGRES_DB: edupulse_advisor
    ports:
      - "5433:5432"
    volumes:
      - postgres-advisor-data:/var/lib/postgresql/data
    networks:
      - edupulse-net

  # ---- Application Services ----
  mock-backend:
    build:
      context: ./services/mock-backend
      dockerfile: Dockerfile
    ports:
      - "${MOCK_PORT:-3010}:3010"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3010
      - MONGO_URI=mongodb://mongo-mock:27017/mock-registration
    depends_on:
      - mongo-mock
    networks:
      - edupulse-net
    restart: unless-stopped

  registry-service:
    build:
      context: ./services/registry-service
      dockerfile: Dockerfile
    ports:
      - "${REGISTRY_PORT:-3001}:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - MONGO_URI=mongodb://mongo-registry:27017/edupulse-registry
    depends_on:
      - mongo-registry
    networks:
      - edupulse-net
    restart: unless-stopped

  traffic-gateway:
    build:
      context: ./services/traffic-gateway
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-3002}:3002"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3002
      - REDIS_URL=redis://redis-gateway:6379
      - MOCK_BACKEND_URL=http://mock-backend:3010
      - BATCH_SIZE=${GATEWAY_BATCH_SIZE:-50}
      - TOKEN_TTL=${GATEWAY_TOKEN_TTL:-180}
      - ADMISSION_INTERVAL=${GATEWAY_ADMISSION_INTERVAL:-2000}
    depends_on:
      - redis-gateway
      - mock-backend
    networks:
      - edupulse-net
    restart: unless-stopped

  probe-engine:
    build:
      context: ./services/probe-engine
      dockerfile: Dockerfile
    ports:
      - "${PROBE_PORT:-3003}:3003"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3003
      - TIMESCALE_URL=postgres://probe:probe_pass@timescaledb:5432/edupulse_metrics
      - PROBE_INTERVAL_MS=${PROBE_INTERVAL_MS:-5000}
    depends_on:
      - timescaledb
    networks:
      - edupulse-net
    restart: unless-stopped

  capacity-advisor:
    build:
      context: ./services/capacity-advisor
      dockerfile: Dockerfile
    ports:
      - "${ADVISOR_PORT:-3004}:3004"
    environment:
      - PORT=3004
      - DATABASE_URL=postgres://advisor:advisor_pass@postgres-advisor:5432/edupulse_advisor
      - GATEWAY_URL=http://traffic-gateway:3002
    depends_on:
      - postgres-advisor
      - traffic-gateway
    networks:
      - edupulse-net
    restart: unless-stopped

  alert-service:
    build:
      context: ./services/alert-service
      dockerfile: Dockerfile
    ports:
      - "${ALERT_PORT:-3005}:3005"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3005
      - MONGO_URI=mongodb://mongo-alert:27017/edupulse-alerts
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    depends_on:
      - mongo-alert
    networks:
      - edupulse-net
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_BASE_URL=http://traffic-gateway:3002
    depends_on:
      - traffic-gateway
      - probe-engine
    networks:
      - edupulse-net
    restart: unless-stopped

  # ---- Reverse Proxy ----
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard
      - traffic-gateway
    networks:
      - edupulse-net
    restart: unless-stopped

volumes:
  mongo-registry-data:
  mongo-alert-data:
  mongo-mock-data:
  redis-data:
  timescale-data:
  postgres-advisor-data:

networks:
  edupulse-net:
    driver: bridge
