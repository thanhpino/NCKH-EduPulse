events {
    worker_connections 1024;
}

http {
    upstream dashboard {
        server dashboard:3000;
    }

    upstream gateway {
        server traffic-gateway:3002;
    }

    upstream registry {
        server registry-service:3001;
    }

    upstream probe {
        server probe-engine:3003;
    }

    upstream advisor {
        server capacity-advisor:3004;
    }

    upstream alerts {
        server alert-service:3005;
    }

    upstream mock {
        server mock-backend:3010;
    }

    server {
        listen 80;
        server_name localhost;

        # Dashboard (default)
        location / {
            proxy_pass http://dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Traffic Gateway
        location /api/queue/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/config/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
        }

        # Registry
        location /api/targets/ {
            proxy_pass http://registry;
            proxy_set_header Host $host;
        }

        # Probe / Metrics
        location /api/metrics/ {
            proxy_pass http://probe;
            proxy_set_header Host $host;
        }

        location /api/probe/ {
            proxy_pass http://probe;
            proxy_set_header Host $host;
        }

        # Capacity Advisor
        location /api/advisor/ {
            proxy_pass http://advisor;
            proxy_set_header Host $host;
        }

        # Alerts
        location /api/alerts/ {
            proxy_pass http://alerts;
            proxy_set_header Host $host;
        }

        # Mock Backend (for demo/testing)
        location /mock/ {
            rewrite ^/mock/(.*) /$1 break;
            proxy_pass http://mock;
            proxy_set_header Host $host;
        }
    }
}
